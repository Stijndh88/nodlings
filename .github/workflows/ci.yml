name: ci
on:
  pull_request:
  push:
    branches: [master]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: for f in *.js loop/*.js; do node --check "$f"; done
      - name: Self-test, headless run, resume, determinism
        run: node loop/ci-check.js
