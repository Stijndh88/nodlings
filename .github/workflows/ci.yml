name: ci
on:
  pull_request:
  push:
    branches: [master]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: for f in *.js loop/*.js test/*.js; do node --check "$f"; done
      - name: Rule tests (physics, no material names in rules, body-only reward, learning)
        run: for t in test/*.test.js; do node "$t"; done
      - name: Self-test, headless run, resume, determinism
        run: node loop/ci-check.js
      - name: Replicated A/B smoke test
        run: node loop/ab.js --aa --quick --ticks=200 --replicates=2
